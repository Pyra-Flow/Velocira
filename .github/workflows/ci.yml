name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ai-service:
    name: AI service tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: docker build --tag velocira-ai-service:ci .

  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  backend:
    name: Backend test and package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify
      - run: docker build --tag velocira-backend:ci .

  migration-smoke-test:
    name: PostgreSQL migration smoke test
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: velocira_ci
          POSTGRES_USER: velocira
          POSTGRES_PASSWORD: velocira-ci-only
        options: >-
          --health-cmd "pg_isready -U velocira -d velocira_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run migrations on a clean PostgreSQL database
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: velocira_ci
          DB_USERNAME: velocira
          DB_PASSWORD: velocira-ci-only
          JWT_SECRET: Y2ktb25seS1qd3Qtc2VjcmV0LW11c3QtYmUtbG9uZy1lbnVnaC1mb3ItaHMyNTY=
        run: |
          ./mvnw -B -DskipTests spring-boot:start
          for attempt in {1..30}; do
            curl --fail --silent --show-error http://localhost:8080/api/actuator/info && exit 0
            sleep 2
          done
          exit 1
      - name: Stop application
        if: always()
        run: ./mvnw -B -DskipTests spring-boot:stop

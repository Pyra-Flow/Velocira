# =============================================================================
# Velocira Backend — Application Configuration
# =============================================================================

spring.config.import=optional:file:.env[.properties]
spring.application.name=velocira-backend
spring.profiles.default=dev

# ======================== Server ========================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

# ======================== Database ========================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:velocira_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ======================== JPA / Hibernate ========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.generate_statistics=false

# ======================== Flyway ========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ======================== JWT Configuration ========================
velocira.security.jwt.secret=${JWT_SECRET}
velocira.security.jwt.access-token-expiration-ms=900000
velocira.security.jwt.refresh-token-expiration-ms=604800000
velocira.security.jwt.issuer=velocira-platform

# Development origin only. The prod profile intentionally requires an explicit value.
velocira.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ======================== Google OAuth2 ========================
velocira.security.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}

# ======================== OTP Configuration ========================
velocira.security.otp.length=6
velocira.security.otp.expiration-minutes=10
velocira.security.otp.max-resend-per-hour=5
velocira.security.otp.max-validation-attempts=3

# ======================== Email / SMTP ========================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
velocira.mail.from-address=${MAIL_FROM:noreply@velocira.com}
velocira.mail.from-name=Velocira

# ======================== Rate Limiting ========================
velocira.rate-limit.auth.capacity=10
velocira.rate-limit.auth.refill-tokens=10
velocira.rate-limit.auth.refill-duration-minutes=1

# ======================== Generation Platform ========================
# Browser clients never receive a model-provider credential. Spring calls only
# the isolated internal AI service over this configured endpoint.
velocira.generation.ai.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
velocira.generation.ai.shared-secret=${AI_SERVICE_SHARED_SECRET:}
velocira.generation.ai.discovery-planner-enabled=${AI_SERVICE_DISCOVERY_PLANNER_ENABLED:true}
velocira.generation.ai.connect-timeout=${AI_SERVICE_CONNECT_TIMEOUT:3s}
velocira.generation.ai.read-timeout=${AI_SERVICE_READ_TIMEOUT:30s}
velocira.generation.worker.core-pool-size=${GENERATION_WORKER_CORE_POOL_SIZE:2}
velocira.generation.worker.max-pool-size=${GENERATION_WORKER_MAX_POOL_SIZE:4}
velocira.generation.worker.queue-capacity=${GENERATION_WORKER_QUEUE_CAPACITY:50}
velocira.generation.worker.max-attempts=${GENERATION_MAX_ATTEMPTS:3}
velocira.generation.worker.retry-backoff=${GENERATION_RETRY_BACKOFF:250ms}
velocira.generation.worker.recovery-delay=${GENERATION_RECOVERY_DELAY:30s}
velocira.generation.worker.stale-after=${GENERATION_STALE_AFTER:2m}
velocira.generation.guard.requests-per-hour=${GENERATION_REQUESTS_PER_HOUR:10}
velocira.generation.guard.max-active-jobs-per-user=${GENERATION_MAX_ACTIVE_JOBS_PER_USER:2}
velocira.generation.guard.estimated-cost-cents-per-job=${GENERATION_ESTIMATED_COST_CENTS_PER_JOB:1}
velocira.generation.guard.max-estimated-cost-cents-per-day=${GENERATION_MAX_ESTIMATED_COST_CENTS_PER_DAY:100}

# ======================== Logging ========================
logging.level.root=INFO
logging.level.com.velocira=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.flywaydb=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{correlationId:-}] %logger{36} - %msg%n

# ======================== Actuator ========================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ======================== Swagger / OpenAPI ========================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.show-actuator=false

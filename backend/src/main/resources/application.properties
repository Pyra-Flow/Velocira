# =============================================================================
# Velocira Backend — Application Configuration
# =============================================================================

spring.config.import=optional:file:.env[.properties]
spring.application.name=velocira-backend

# ======================== Server ========================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

# ======================== Database ========================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:velocira_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ======================== JPA / Hibernate ========================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.generate_statistics=false

# ======================== Flyway ========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ======================== JWT Configuration ========================
velocira.security.jwt.secret=${JWT_SECRET:your-256-bit-secret-key-change-in-production-must-be-at-least-256-bits-long}
velocira.security.jwt.access-token-expiration-ms=900000
velocira.security.jwt.refresh-token-expiration-ms=604800000
velocira.security.jwt.issuer=velocira-platform

# ======================== Google OAuth2 ========================
velocira.security.oauth2.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}

# ======================== OTP Configuration ========================
velocira.security.otp.length=6
velocira.security.otp.expiration-minutes=10
velocira.security.otp.max-resend-per-hour=5
velocira.security.otp.max-validation-attempts=3

# ======================== Email / SMTP ========================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
velocira.mail.from-address=${MAIL_FROM:noreply@velocira.com}
velocira.mail.from-name=Velocira

# ======================== Rate Limiting ========================
velocira.rate-limit.auth.capacity=10
velocira.rate-limit.auth.refill-tokens=10
velocira.rate-limit.auth.refill-duration-minutes=1

# ======================== Logging ========================
logging.level.root=INFO
logging.level.com.velocira=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.flywaydb=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ======================== Actuator ========================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ======================== Swagger / OpenAPI ========================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.show-actuator=false

# ============================================================
# Test Configuration (overrides main application.properties)
# ============================================================

spring.application.name=velocira-backend-test

# ======================== DataSource (H2 In-Memory) =========
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ======================== JPA / Hibernate ====================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ======================== Flyway (disabled for tests) ========
spring.flyway.enabled=false

# ======================== JWT ================================
velocira.security.jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci11bml0LXRlc3RzLW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHM=
velocira.security.jwt.access-token-expiration-ms=900000
velocira.security.jwt.refresh-token-expiration-ms=604800000
velocira.security.jwt.issuer=velocira-test
velocira.cors.allowed-origins=http://localhost:3000
velocira.generation.ai.discovery-planner-enabled=false

# ======================== Google OAuth2 ======================
velocira.security.oauth2.google.client-id=test-google-client-id

# ======================== OTP ================================
velocira.security.otp.length=6
velocira.security.otp.expiration-minutes=10
velocira.security.otp.max-resend-per-hour=5
velocira.security.otp.max-validation-attempts=3

# ======================== Rate Limiting ======================
velocira.rate-limit.auth.capacity=100
velocira.rate-limit.auth.refill-tokens=100
velocira.rate-limit.auth.refill-duration-minutes=1

# ======================== Mail (disabled for tests) ==========
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test
velocira.mail.from-address=noreply@test.velocira.com
velocira.mail.from-name=Velocira Test

# ======================== Logging ============================
logging.level.root=WARN
logging.level.com.velocira=DEBUG

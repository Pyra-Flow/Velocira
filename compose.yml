# Canonical local-development stack. Run from the repository root with:
#   docker compose up --build --wait
name: velocira

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-velocira_db}
      POSTGRES_USER: ${POSTGRES_USER:-velocira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': >/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
    environment:
      AI_SERVICE_ENVIRONMENT: ${AI_SERVICE_ENVIRONMENT:-development}
      AI_SERVICE_PROVIDER: ${AI_SERVICE_PROVIDER:-deterministic}
      AI_SERVICE_MODEL: ${AI_SERVICE_MODEL:-velocira-deterministic-v1}
      AI_SERVICE_DISCOVERY_MODEL: ${AI_SERVICE_DISCOVERY_MODEL:-velocira-deterministic-v1}
      AI_SERVICE_FALLBACK_MODEL: ${AI_SERVICE_FALLBACK_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_SERVICE_GEMINI_BASE_URL: ${AI_SERVICE_GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      AI_SERVICE_PROVIDER_TIMEOUT_SECONDS: ${AI_SERVICE_PROVIDER_TIMEOUT_SECONDS:-600}
      AI_SERVICE_MAX_INPUT_BYTES: ${AI_SERVICE_MAX_INPUT_BYTES:-65536}
      AI_SERVICE_LOG_LEVEL: ${AI_SERVICE_LOG_LEVEL:-INFO}
      AI_SERVICE_QDRANT_URL: http://qdrant:6333
      AI_SERVICE_QDRANT_COLLECTION: ${AI_SERVICE_QDRANT_COLLECTION:-velocira_project_evidence_v1}
      AI_SERVICE_EMBEDDING_MODEL: ${AI_SERVICE_EMBEDDING_MODEL:-gemini-embedding-2}
      AI_SERVICE_EMBEDDING_DIMENSIONS: ${AI_SERVICE_EMBEDDING_DIMENSIONS:-768}
      AI_SERVICE_INTERNAL_TOKEN: ${AI_SERVICE_SHARED_SECRET:?Set AI_SERVICE_SHARED_SECRET in .env}
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        until python -c "import urllib.request; urllib.request.urlopen('http://qdrant:6333/healthz')"; do sleep 2; done
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms128m -Xmx512m}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-velocira_db}
      DB_USERNAME: ${POSTGRES_USER:-velocira}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@example.invalid}
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      AI_SERVICE_BASE_URL: http://ai-service:8000
      AI_SERVICE_SHARED_SECRET: ${AI_SERVICE_SHARED_SECRET:?Set AI_SERVICE_SHARED_SECRET in .env}
      AI_SERVICE_CONNECT_TIMEOUT: ${AI_SERVICE_CONNECT_TIMEOUT:-3s}
      AI_SERVICE_DISCOVERY_PLANNER_TIMEOUT: ${AI_SERVICE_DISCOVERY_PLANNER_TIMEOUT:-120s}
      AI_SERVICE_READ_TIMEOUT: ${AI_SERVICE_READ_TIMEOUT:-30m}
      AI_SERVICE_DISCOVERY_PLANNER_ENABLED: ${AI_SERVICE_DISCOVERY_PLANNER_ENABLED:-true}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -ec
      - |
        until (echo > /dev/tcp/postgres/5432) 2>/dev/null; do sleep 2; done
        until curl --fail --silent http://ai-service:8000/ready >/dev/null; do sleep 2; done
        exec java -jar /app/velocira.jar
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/api/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    environment:
      NODE_ENV: production
      NODE_OPTIONS: ${NODE_OPTIONS:---max-old-space-size=256}
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        until wget --quiet --tries=1 --spider http://backend:8080/api/actuator/health; do sleep 2; done
        exec node server.js
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  qdrant-data:
